[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-connector"
version = "0.3.0"
description = "Portable, model-free bridges for an enterprise Notion and Obsidian work setup"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
enterprise-connector = "work_context.cli:main"
work-context = "work_context.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
work_context = ["notion_schema.json"]
